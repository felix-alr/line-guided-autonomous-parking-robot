site_name: "Line Guided Autonomous Parking Robot"
docs_dir: './robot_docs'
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
- Home: index.md
- Control:
  - Overview: ./control/overview.md
  - "Kinematic Controller": ./control/kinematic-controller.md
  - "Trajectory Generation": ./control/trajectory-generation.md
  - "Trajectory Tracing": ./control/trajectory-tracing.md
- Guidance: guidance.md
- Perception: perception.md
- Navigation: navigation.md
- HMI: hmi.md